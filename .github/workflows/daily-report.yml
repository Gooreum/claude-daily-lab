# daily-report.yml — PR이 올라오면 보고 메일을 보낸다.
# 로컬·Routine은 스킬 6절 5단계(send_report.py)가, GitHub Actions 예약 실행은 daily-lab.yml의 "요약 메일" 단계가 보내므로
# 여기서는 그 두 경로가 못 보는 경우만 맡는다: 클라우드 세션이 main 대신 claude/ 브랜치로 PR을 연 경우.
# 같은 스크립트·같은 시크릿(DAILY_LAB_SMTP_USER / DAILY_LAB_SMTP_PASS / DAILY_LAB_MAIL_TO)을 쓴다. 없으면 조용히 건너뛴다.
name: Daily Report (PR)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 50

      - name: PR 보고 메일
        env:
          DAILY_LAB_SMTP_USER: ${{ secrets.DAILY_LAB_SMTP_USER }}
          DAILY_LAB_SMTP_PASS: ${{ secrets.DAILY_LAB_SMTP_PASS }}
          DAILY_LAB_MAIL_TO: ${{ secrets.DAILY_LAB_MAIL_TO }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # PR 제목이 "day: YYYY-MM-DD slug"면 그 날짜로, 아니면 오늘(KST)로 요약한다
          DATE=$(printf '%s' "$PR_TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          python3 .claude/skills/daily-lab/send_report.py --date "$DATE" \
            --note "PR #$PR_NUMBER 올라옴 ($PR_BRANCH → main): $PR_URL — 규칙은 main 직접 푸시이므로 내용을 보고 머지한다"
